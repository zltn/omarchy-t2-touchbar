# Run the locally-built tiny-dfr instead of the packaged one.
#
# The package owns /usr/bin/tiny-dfr and overwrites it on every upgrade, taking
# the local slider patch with it. Keeping the build in /usr/local/bin puts it
# outside pacman's reach; this override is what makes the service use it.
#
# The empty ExecStart= is required -- it clears the packaged value before
# setting a new one, otherwise systemd would treat this as a second command.
[Service]
ExecStart=
ExecStart=/usr/local/bin/tiny-dfr
