# tiny-dfr layout TEMPLATE. Rendered into config.toml by the io.github.zltn.t2-touchbar shell
# plugin (or by tiny-dfr-workspace.service on machines without omarchy-shell)
# every time the active Hyprland workspace or an indicator changes.
#
# DO NOT EDIT /etc/tiny-dfr/config.toml -- it is generated from this file and
# overwritten on the next change. Edit this template; it is watched, so saving
# it is enough to redraw. A template that fails to parse is SILENTLY ignored and
# tiny-dfr falls back to its packaged layout, so validate before saving:
#   python3 -c 'import tomllib,sys; tomllib.load(open(sys.argv[1],"rb"))' config.template.toml
#
# The workspace marker below becomes one button per workspace (WORKSPACES= in
# touchbar.conf).
# The generated file is merged over /usr/share/tiny-dfr/config.toml, per-key,
# with the generated copy winning.

MediaLayerDefault = true
DoublePressSwitchLayers = 200

# The Touch Bar is an OLED panel showing a clock that never moves. Pixel shift
# slowly walks the surface to spread that wear out.
EnablePixelShift = true

ShowButtonOutlines = true
AdaptiveBrightness = true

# ---------------------------------------------------------------------------
# Default layer -- laid out like the Omarchy bar, in the same order:
#
#   left: workspaces  |  centre: clock, weather, update  |  right: panels
#
# 18 configured units + auto-inserted escape = 19. The clock lands on slots
# 8-10 of 19, i.e. genuinely centred, which is why the spacers are where they
# are. Upstream warns rendering breaks around 24, so there is room to spare.
#
# Hardware keys (brightness, volume, mic) moved to the Fn layer -- this Mac has
# no physical function row, so deleting them outright would leave no way to
# change brightness or volume at all.
# ---------------------------------------------------------------------------
MediaLayerKeys = [
@WORKSPACES@

    { Stretch = 1 },

    { Time = "%a %H:%M", Action = "Time", Stretch = 3 },
    { Icon = "weather", Action = [ "LeftMeta", "LeftCtrl", "LeftAlt", "W" ] },
    { Icon = "update",  Action = [ "LeftMeta", "LeftCtrl", "U" ] },

    { Stretch = 1 },

    # Mirrors the bar's right section, same order. All five bindings already
    # existed in Omarchy's default/hypr/bindings/utilities.lua except AI, which
    # lives in ~/.config/hypr/bindings.lua:
    #   SUPER+CTRL+G -> omarchy-shell shell toggle omarchy.agents   (AI usage)
    #   SUPER+CTRL+W -> omarchy-shell shell toggle omarchy.network  (Wifi)
    #   SUPER+CTRL+A -> omarchy-shell shell toggle omarchy.audio    (Sound)
    #   SUPER+CTRL+D -> omarchy-shell shell toggle omarchy.monitor  (Display)
    #   SUPER+CTRL+P -> omarchy-shell shell toggle omarchy.power    (Battery)
    #
    # Icons are Material Symbols on the same grid and with the same explicit
    # fill="white" as the icons tiny-dfr bundles, in /etc/tiny-dfr/ (searched
    # BEFORE /usr/share/tiny-dfr, so upgrades cannot clobber them). NOT XDG
    # theme icons: breeze-dark's use fill="currentColor", which librsvg
    # resolves to black -- invisible on a black Touch Bar.
    { Icon = "ai",      Action = [ "LeftMeta", "LeftCtrl", "G" ] },
    { Icon = "wifi",    Action = [ "LeftMeta", "LeftCtrl", "W" ] },
    { Icon = "sound",   Action = [ "LeftMeta", "LeftCtrl", "A" ] },
    { Icon = "display", Action = [ "LeftMeta", "LeftCtrl", "D" ] },

    # Battery is a plain Icon, NOT tiny-dfr's Battery widget. battery.svg is
    # regenerated by tiny-dfr-workspace whenever the level crosses a 5% bucket
    # or the charging state flips. The shell is white like every other icon on
    # the strip; only the fill inside is coloured, and only by level:
    # green >=20%, amber 5-19%, red <5%, plus a bolt cutout while charging.
    #
    # Done this way for two reasons. The built-in widget only ever colours
    # green-when-charging / red-under-10% (main.rs ~460) with no amber and no
    # per-level tint; and its charge_now/charge_full has no clamp, so a full
    # charge on this cell reported 101%. Computing it in the daemon fixes both.
    # IconHeight is 48 -- the same box height as every other icon here -- so the
    # battery gets identical top/bottom padding in the 60px panel. Width is 72,
    # not a full 2:1, so it keeps a visible gap from the icon on its right.
    # The generated SVG's viewBox is 72x48 to match: librsvg preserves aspect
    # ratio, so a mismatched viewBox would letterbox instead of filling.
    { Icon = "battery", Action = [ "LeftMeta", "LeftCtrl", "P" ], IconWidth = 72, IconHeight = 48 }
]

# ---------------------------------------------------------------------------
# Fn layer: F1-F12, the hardware keys, and the menus. 20 units + escape = 21.
#   SUPER+SPACE  -> omarchy-menu toggle         (root menu / launcher)
#   SUPER+ESCAPE -> omarchy-menu toggle system  (lock, restart, shutdown)
# ---------------------------------------------------------------------------
PrimaryLayerKeys = [
    { Text = "F1",  Action = "F1"  },
    { Text = "F2",  Action = "F2"  },
    { Text = "F3",  Action = "F3"  },
    { Text = "F4",  Action = "F4"  },
    { Text = "F5",  Action = "F5"  },
    { Text = "F6",  Action = "F6"  },
    { Text = "F7",  Action = "F7"  },
    { Text = "F8",  Action = "F8"  },
    { Text = "F9",  Action = "F9"  },
    { Text = "F10", Action = "F10" },
    { Text = "F11", Action = "F11" },
    { Text = "F12", Action = "F12" },

    { Stretch = 1 },

    { Icon = "brightness_low",  Action = "BrightnessDown" },
    { Icon = "brightness_high", Action = "BrightnessUp"   },
    { Icon = "volume_down",     Action = "VolumeDown"     },
    { Icon = "volume_up",       Action = "VolumeUp"       },
    { Icon = "mic",             Action = "MicMute"        },

    { Text = "Menu",  Action = [ "LeftMeta", "Space" ] },
    { Text = "Power", Action = [ "LeftMeta", "Esc"   ] }
]
